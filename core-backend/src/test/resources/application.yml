# Configuração usada apenas quando os testes correm (src/test/resources tem
# precedência sobre src/main/resources no classpath de teste).
#
# Substitui o TimescaleDB real por uma base de dados H2 em memória, para que
# `mvn test` não exija um PostgreSQL/TimescaleDB a correr localmente.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  rabbitmq:
    listener:
      simple:
        auto-startup: false  # evita tentar ligar a um RabbitMQ real durante os testes
