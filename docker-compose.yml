version: "3.9"

# TrendPulse AI - Stack completa
#
# Serviços:
#   rabbitmq     - broker de mensageria (AMQP + UI de management)
#   timescaledb  - PostgreSQL + extensão TimescaleDB (histórico de previsões)
#   core-backend - Spring Boot: consome RabbitMQ, persiste em TimescaleDB, expõe WebSocket /ws-market
#   ml-trainer   - treina o modelo scikit-learn uma vez e termina (job, não daemon)
#   dashboard    - Streamlit: UI, publica previsões no RabbitMQ, lê o modelo treinado
#   prometheus   - faz scrape das métricas Micrometer do core-backend (/actuator/prometheus)
#   grafana      - dashboard de latência/throughput, provisionado automaticamente
#
# Uso:
#   docker compose up -d --build                # sobe tudo, incluindo Prometheus + Grafana
#   docker compose --profile training run --rm ml-trainer   # treina/retreina o modelo
#   docker compose logs -f core-backend
#   docker compose down                          # -v para também apagar volumes (incl. histórico de previsões)
#
# Grafana: http://localhost:3000 (admin/admin, ou acesso anónimo como Viewer)
# Prometheus: http://localhost:9090

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trendpulse-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (http://localhost:15672, guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - trendpulse-net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trendpulse-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trendpulse
      POSTGRES_USER: trendpulse
      POSTGRES_PASSWORD: trendpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendpulse -d trendpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - trendpulse-net

  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: trendpulse-core-backend
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: trendpulse
      POSTGRES_USER: trendpulse
      POSTGRES_PASSWORD: trendpulse
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trendpulse-net

  # Job de treino: corre uma vez, guarda o modelo no volume partilhado, e termina.
  # Fica atrás de um profile para não subir automaticamente com `docker compose up`.
  ml-trainer:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    container_name: trendpulse-ml-trainer
    volumes:
      - ml-models:/app/models
    networks:
      - trendpulse-net
    profiles:
      - training

  dashboard:
    build:
      context: .                       # contexto = raiz do monorepo (ver dashboard/Dockerfile)
      dockerfile: dashboard/Dockerfile
    container_name: trendpulse-dashboard
    ports:
      - "8501:8501"
    environment:
      RABBITMQ_HOST: rabbitmq          # visto de dentro da rede Docker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      BACKEND_PUBLIC_URL: http://localhost:8080    # visto do BROWSER do utilizador (fora do Docker) — usado pelo cliente WebSocket
      BACKEND_INTERNAL_URL: http://core-backend:8080  # visto de DENTRO da rede Docker — usado pelas chamadas REST (accuracy/history) do próprio processo do dashboard
    volumes:
      - ml-models:/app/ml-engine/models  # partilha o modelo treinado pelo ml-trainer
    depends_on:
      rabbitmq:
        condition: service_healthy
      core-backend:
        condition: service_healthy
    networks:
      - trendpulse-net

  # --- Observabilidade: latência e throughput (Micrometer -> Prometheus -> Grafana) ---

  prometheus:
    image: prom/prometheus:latest
    container_name: trendpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      core-backend:
        condition: service_healthy
    networks:
      - trendpulse-net

  grafana:
    image: grafana/grafana:latest
    container_name: trendpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Acesso anónimo como Viewer, só para facilitar abrir o dashboard
      # rapidamente num ambiente de demo/portfolio — desativa isto (ou troca
      # a password de admin) antes de expor a stack fora da tua máquina.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - trendpulse-net

networks:
  trendpulse-net:
    driver: bridge

volumes:
  rabbitmq-data:
  timescale-data:
  ml-models:
  prometheus-data:
  grafana-data:
